
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Remover</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  color: #202333;
  padding: 25px 15px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

header h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

header p {
  color: #777;
  line-height: 1.6;
}

.panel {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 5px 25px rgba(0,0,0,.05);
  margin-bottom: 22px;
}

.upload-box {
  display: block;
  border: 2px dashed #aab2c5;
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: .2s;
}

.upload-box:hover,
.upload-box.dragging {
  border-color: #5b65e8;
  background: #f8f8ff;
}

.upload-box h3 {
  margin-bottom: 10px;
}

.upload-box p {
  color: #888;
  font-size: 14px;
  margin-top: 5px;
}

input[type=file] {
  display: none;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 9px;
  background: #5b65e8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #424bc7;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.secondary {
  background: #e9ebf8;
  color: #333;
}

.secondary:hover {
  background: #d9dcf2;
}

.danger {
  background: #e74c3c;
}

.danger:hover {
  background: #c0392b;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.toolbar button {
  flex: 1;
  min-width: 150px;
}

.status {
  margin-top: 15px;
  color: #666;
  font-size: 14px;
  line-height: 1.6;
}

.progress {
  height: 9px;
  background: #e6e6e6;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #5b65e8;
  transition: width .2s;
}

.hint {
  color: #777;
  font-size: 13px;
  line-height: 1.7;
  margin-top: 15px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 18px;
}

.image-card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,.05);
  min-width: 0;
}

.image-card h3 {
  font-size: 14px;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.canvas-wrap {
  width: 100%;
  background: #eee;
  border-radius: 8px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  cursor: crosshair;
  touch-action: none;
}

.image-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.image-actions button {
  flex: 1;
  padding: 9px 7px;
  font-size: 12px;
}

.small-status {
  margin-top: 8px;
  font-size: 12px;
  color: #777;
}

.empty {
  text-align: center;
  padding: 35px;
  color: #999;
  background: white;
  border-radius: 12px;
}

@media(max-width: 600px) {
  body {
    padding: 15px 10px;
  }

  header h1 {
    font-size: 25px;
  }

  .panel {
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Watermark Remover</h1>
  <p>Công cụ khoanh vùng và xử lý watermark trên ảnh</p>
</header>

<section class="panel">

  <label class="upload-box" id="uploadBox" for="fileInput">
    <h3>📁 Chọn hoặc kéo thả ảnh vào đây</h3>
    <p>Hỗ trợ JPG, JPEG, PNG, WEBP</p>
    <p>Có thể chọn nhiều ảnh cùng lúc</p>
  </label>

  <input
    id="fileInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
  >

  <div class="toolbar">
    <button id="autoBtn" class="secondary">
      Dò vùng sáng thử nghiệm
    </button>

    <button id="processBtn">
      Xử lý tất cả ảnh
    </button>

    <button id="downloadBtn" disabled>
      Tải ZIP kết quả
    </button>
  </div>

  <p class="hint">
    Hướng dẫn: Tải ảnh lên, sau đó dùng chuột kéo một hình chữ nhật
    quanh vùng watermark. Vùng màu đỏ là vùng sẽ được xử lý.
    Bạn có thể khoanh nhiều vùng trên một ảnh.
  </p>

  <div id="status" class="status">
    Đang chờ tải ảnh...
  </div>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

</section>

<section id="gallery" class="gallery">
  <div class="empty">Chưa có ảnh nào được tải lên.</div>
</section>

</div>

<script>
/* ======================================
   1. BIẾN VÀ THÀNH PHẦN GIAO DIỆN
====================================== */

const fileInput = document.getElementById("fileInput");
const gallery = document.getElementById("gallery");
const statusBox = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const processBtn = document.getElementById("processBtn");
const downloadBtn = document.getElementById("downloadBtn");
const autoBtn = document.getElementById("autoBtn");
const uploadBox = document.getElementById("uploadBox");

let images = [];
let zipBlob = null;
let cvPromise = null;
let zipPromise = null;

function setStatus(message) {
  statusBox.textContent = message;
}

function setProgress(value) {
  progressBar.style.width = value + "%";
}


/* ======================================
   2. TẢI OPENCV.JS VỚI NHIỀU ĐƯỜNG DẪN
====================================== */

function checkOpenCV() {
  return !!(
    window.cv &&
    window.cv.Mat &&
    window.cv.imread &&
    window.cv.inpaint
  );
}

function waitForOpenCV(timeout = 60000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();

    const timer = setInterval(() => {
      if (checkOpenCV()) {
        clearInterval(timer);
        resolve(window.cv);
        return;
      }

      if (Date.now() - start > timeout) {
        clearInterval(timer);
        reject(new Error("OpenCV chưa khởi tạo xong."));
      }
    }, 250);
  });
}

async function loadOpenCV() {
  if (checkOpenCV()) return window.cv;

  if (cvPromise) return cvPromise;

  cvPromise = (async () => {

    const urls = [
      "https://docs.opencv.org/4.10.0/opencv.js",
      "https://docs.opencv.org/4.x/opencv.js"
    ];

    let lastError = null;

    for (const url of urls) {
      try {
        setStatus("Đang tải thư viện xử lý ảnh...");

        await new Promise((resolve, reject) => {

          const script = document.createElement("script");

          script.src = url;
          script.async = true;

          script.onload = resolve;

          script.onerror = () => {
            script.remove();
            reject(new Error("Không tải được: " + url));
          };

          document.head.appendChild(script);

        });

        const cvInstance = await waitForOpenCV(60000);

        setStatus("Đã tải thư viện xử lý ảnh thành công.");

        return cvInstance;

      } catch (error) {
        lastError = error;
        console.error(error);
      }
    }

    throw new Error(
      "Không thể tải OpenCV.js. Hãy kiểm tra kết nối Internet hoặc thử lại sau."
    );

  })();

  try {
    return await cvPromise;
  } catch (error) {
    cvPromise = null;
    throw error;
  }
}


/* ======================================
   3. TẢI THƯ VIỆN ZIP
====================================== */

async function loadJSZip() {
  if (window.JSZip) return window.JSZip;

  if (zipPromise) return zipPromise;

  zipPromise = new Promise((resolve, reject) => {

    const script = document.createElement("script");

    script.src =
      "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

    script.onload = () => {
      if (window.JSZip) {
        resolve(window.JSZip);
      } else {
        reject(new Error("Không thể khởi tạo JSZip."));
      }
    };

    script.onerror = () => {
      script.remove();
      reject(new Error("Không tải được thư viện ZIP."));
    };

    document.head.appendChild(script);

  });

  try {
    return await zipPromise;
  } catch (error) {
    zipPromise = null;
    throw error;
  }
}


/* ======================================
   4. ĐỌC ẢNH
====================================== */

function loadImage(file) {
  return new Promise((resolve, reject) => {

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      resolve({ img, url });
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Không thể đọc ảnh."));
    };

    img.src = url;

  });
}

async function addFiles(fileList) {

  const validFiles = [...fileList].filter(file =>
    ["image/jpeg", "image/png", "image/webp"].includes(file.type)
  );

  if (!validFiles.length) {
    setStatus("Vui lòng chọn ảnh JPG, PNG hoặc WEBP.");
    return;
  }

  setStatus("Đang tải ảnh...");

  for (const file of validFiles) {

    try {
      const { img, url } = await loadImage(file);

      const canvas = document.createElement("canvas");

      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;

      images.push({
        file,
        img,
        url,
        canvas,
        regions: [],
        resultBlob: null
      });

    } catch (error) {
      console.error(error);
    }
  }

  renderGallery();

  zipBlob = null;
  downloadBtn.disabled = true;

  setStatus("Đã tải " + images.length + " ảnh.");

}


/* ======================================
   5. HIỂN THỊ ẢNH VÀ VÙNG ĐÁNH DẤU
====================================== */

function drawImage(item) {

  const canvas = item.canvas;
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(
    item.img,
    0,
    0,
    canvas.width,
    canvas.height
  );

  item.regions.forEach(region => {

    ctx.fillStyle = "rgba(255,0,0,0.35)";
    ctx.strokeStyle = "#ff0000";
    ctx.lineWidth = Math.max(2, canvas.width / 300);

    ctx.fillRect(
      region.x,
      region.y,
      region.w,
      region.h
    );

    ctx.strokeRect(
      region.x,
      region.y,
      region.w,
      region.h
    );

  });
}

function renderGallery() {

  gallery.innerHTML = "";

  if (!images.length) {
    gallery.innerHTML =
      '<div class="empty">Chưa có ảnh nào được tải lên.</div>';
    return;
  }

  images.forEach((item, index) => {

    const card = document.createElement("div");
    card.className = "image-card";

    const title = document.createElement("h3");
    title.textContent = (index + 1) + ". " + item.file.name;

    const wrap = document.createElement("div");
    wrap.className = "canvas-wrap";

    wrap.appendChild(item.canvas);

    const actions = document.createElement("div");
    actions.className = "image-actions";

    const undoBtn = document.createElement("button");
    undoBtn.className = "secondary";
    undoBtn.textContent = "Hoàn tác";

    undoBtn.onclick = () => {

      item.regions.pop();
      item.resultBlob = null;

      drawImage(item);
      invalidateZip();

    };

    const clearBtn = document.createElement("button");
    clearBtn.className = "danger";
    clearBtn.textContent = "Xóa vùng";

    clearBtn.onclick = () => {

      item.regions = [];
      item.resultBlob = null;

      drawImage(item);
      invalidateZip();

    };

    actions.append(undoBtn, clearBtn);

    const info = document.createElement("div");
    info.className = "small-status";

    info.textContent =
      "Kích thước: " +
      item.canvas.width + " × " +
      item.canvas.height +
      " | Vùng đã khoanh: " + item.regions.length;

    card.append(title, wrap, actions, info);

    gallery.appendChild(card);

    setupSelection(item);

    drawImage(item);

  });

}

function invalidateZip() {
  zipBlob = null;
  downloadBtn.disabled = true;
}


/* ======================================
   6. KHOANH VÙNG WATERMARK
====================================== */

function setupSelection(item) {

  const canvas = item.canvas;

  let drawing = false;
  let startX = 0;
  let startY = 0;

  function getPosition(event) {

    const rect = canvas.getBoundingClientRect();

    return {
      x: (event.clientX - rect.left) *
         canvas.width / rect.width,

      y: (event.clientY - rect.top) *
         canvas.height / rect.height
    };

  }

  canvas.addEventListener("pointerdown", event => {

    event.preventDefault();

    drawing = true;

    const pos = getPosition(event);

    startX = pos.x;
    startY = pos.y;

    canvas.setPointerCapture(event.pointerId);

  });

  canvas.addEventListener("pointermove", event => {

    if (!drawing) return;

    event.preventDefault();

    const pos = getPosition(event);

    drawImage(item);

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "rgba(255,0,0,0.35)";
    ctx.strokeStyle = "red";
    ctx.lineWidth = Math.max(2, canvas.width / 300);

    ctx.fillRect(
      startX,
      startY,
      pos.x - startX,
      pos.y - startY
    );

    ctx.strokeRect(
      startX,
      startY,
      pos.x - startX,
      pos.y - startY
    );

  });

  function finish(event) {

    if (!drawing) return;

    drawing = false;

    const pos = getPosition(event);

    const x = Math.max(0, Math.min(startX, pos.x));
    const y = Math.max(0, Math.min(startY, pos.y));

    const w = Math.min(
      canvas.width - x,
      Math.abs(pos.x - startX)
    );

    const h = Math.min(
      canvas.height - y,
      Math.abs(pos.y - startY)
    );

    if (w > 2 && h > 2) {

      item.regions.push({
        x,
        y,
        w,
        h
      });

      item.resultBlob = null;

      invalidateZip();

    }

    drawImage(item);

    updateCardInfo(item);

  }

  canvas.addEventListener("pointerup", finish);

  canvas.addEventListener("pointercancel", () => {
    drawing = false;
    drawImage(item);
  });

}

function updateCardInfo(item) {

  const cards = [...document.querySelectorAll(".image-card")];

  const index = images.indexOf(item);

  if (cards[index]) {

    const info = cards[index].querySelector(".small-status");

    if (info) {
      info.textContent =
        "Kích thước: " +
        item.canvas.width + " × " +
        item.canvas.height +
        " | Vùng đã khoanh: " + item.regions.length;
    }

  }

}


/* ======================================
   7. TẠO MASK
====================================== */

function createMask(item) {

  const cv = window.cv;

  const mask = new cv.Mat.zeros(
    item.canvas.height,
    item.canvas.width,
    cv.CV_8UC1
  );

  item.regions.forEach(region => {

    const x = Math.max(0, Math.floor(region.x));
    const y = Math.max(0, Math.floor(region.y));

    const w = Math.min(
      item.canvas.width - x,
      Math.ceil(region.w)
    );

    const h = Math.min(
      item.canvas.height - y,
      Math.ceil(region.h)
    );

    if (w <= 0 || h <= 0) return;

    cv.rectangle(
      mask,
      new cv.Point(x, y),
      new cv.Point(x + w, y + h),
      new cv.Scalar(255),
      -1
    );

  });

  return mask;

}


/* ======================================
   8. XỬ LÝ MỘT ẢNH
====================================== */

async function processImage(item) {

  if (!item.regions.length) return null;

  const cv = window.cv;

  // Đọc ảnh gốc, không đọc canvas có vùng đỏ đánh dấu.
  const sourceRGBA = cv.imread(item.img);

  const sourceRGB = new cv.Mat();
  const outputRGB = new cv.Mat();
  const outputRGBA = new cv.Mat();

  let mask = null;

  try {

    // Chuyển RGBA thành RGB để tương thích với inpaint.
    cv.cvtColor(
      sourceRGBA,
      sourceRGB,
      cv.COLOR_RGBA2RGB
    );

    mask = createMask(item);

    // Thuật toán tái tạo vùng ảnh.
    cv.inpaint(
      sourceRGB,
      mask,
      outputRGB,
      5,
      cv.INPAINT_TELEA
    );

    // Chuyển kết quả về RGBA để hiển thị.
    cv.cvtColor(
      outputRGB,
      outputRGBA,
      cv.COLOR_RGB2RGBA
    );

    const resultCanvas = document.createElement("canvas");

    resultCanvas.width = item.canvas.width;
    resultCanvas.height = item.canvas.height;

    cv.imshow(resultCanvas, outputRGBA);

    return await new Promise((resolve, reject) => {

      resultCanvas.toBlob(blob => {

        if (!blob) {
          reject(new Error("Không thể xuất ảnh."));
          return;
        }

        resolve(blob);

      }, "image/png");

    });

  } finally {

    sourceRGBA.delete();
    sourceRGB.delete();
    outputRGB.delete();
    outputRGBA.delete();

    if (mask) mask.delete();

  }

}


/* ======================================
   9. XỬ LÝ HÀNG LOẠT
====================================== */

processBtn.onclick = async () => {

  if (!images.length) {
    setStatus("Bạn chưa tải ảnh lên.");
    return;
  }

  const selectedImages = images.filter(
    item => item.regions.length > 0
  );

  if (!selectedImages.length) {
    setStatus("Bạn cần khoanh vùng watermark trước.");
    return;
  }

  processBtn.disabled = true;
  autoBtn.disabled = true;
  downloadBtn.disabled = true;

  zipBlob = null;
  setProgress(0);

  try {

    setStatus("Đang tải thư viện xử lý ảnh...");

    await loadOpenCV();

    setStatus("Đang xử lý ảnh...");

    let completed = 0;
    let failed = 0;

    for (const item of selectedImages) {

      setStatus(
        "Đang xử lý " +
        (completed + failed + 1) +
        "/" +
        selectedImages.length +
        ": " +
        item.file.name
      );

      try {

        const blob = await processImage(item);

        if (blob) {
          item.resultBlob = blob;
          completed++;
        }

      } catch (error) {

        console.error(error);
        failed++;

      }

      setProgress(
        ((completed + failed) / selectedImages.length) * 100
      );

    }

    if (!completed) {
      throw new Error("Không có ảnh nào xử lý thành công.");
    }

    setStatus("Đang tạo file ZIP...");

    const JSZip = await loadJSZip();

    const zip = new JSZip();

    images.forEach((item, index) => {

      if (!item.resultBlob) return;

      const filename = item.file.name
        .replace(/\.[^.]+$/, "")
        .replace(/[\\/:*?"<>|]/g, "_");

      zip.file(
        (index + 1) + "_" + filename + "_clean.png",
        item.resultBlob
      );

    });

    zipBlob = await zip.generateAsync({
      type: "blob"
    });

    downloadBtn.disabled = false;

    setStatus(
      "Hoàn tất! Thành công: " +
      completed +
      " ảnh. Thất bại: " +
      failed +
      " ảnh. Nhấn Tải ZIP kết quả để tải xuống."
    );

  } catch (error) {

    console.error(error);

    setStatus("Lỗi: " + error.message);

  } finally {

    processBtn.disabled = false;
    autoBtn.disabled = false;

  }

};


/* ======================================
   10. DÒ VÙNG SÁNG THỬ NGHIỆM
====================================== */

autoBtn.onclick = async () => {

  if (!images.length) {
    setStatus("Bạn chưa tải ảnh lên.");
    return;
  }

  autoBtn.disabled = true;
  processBtn.disabled = true;

  try {

    await loadOpenCV();

    const cv = window.cv;

    let detected = 0;

    for (const item of images) {

      const source = cv.imread(item.img);

      const gray = new cv.Mat();
      const mask = new cv.Mat();

      const contours = new cv.MatVector();
      const hierarchy = new cv.Mat();

      try {

        cv.cvtColor(
          source,
          gray,
          cv.COLOR_RGBA2GRAY
        );

        cv.threshold(
          gray,
          mask,
          235,
          255,
          cv.THRESH_BINARY
        );

        cv.findContours(
          mask,
          contours,
          hierarchy,
          cv.RETR_EXTERNAL,
          cv.CHAIN_APPROX_SIMPLE
        );

        item.regions = [];

        for (let i = 0; i < contours.size(); i++) {

          const contour = contours.get(i);

          try {

            const rect = cv.boundingRect(contour);

            const area = rect.width * rect.height;

            if (
              area > 80 &&
              rect.width < item.canvas.width * 0.25 &&
              rect.height < item.canvas.height * 0.25
            ) {

              item.regions.push({
                x: rect.x,
                y: rect.y,
                w: rect.width,
                h: rect.height
              });

            }

          } finally {
            contour.delete();
          }

        }

        if (item.regions.length) detected++;

        item.resultBlob = null;

      } finally {

        source.delete();
        gray.delete();
        mask.delete();
        contours.delete();
        hierarchy.delete();

      }

    }

    renderGallery();

    invalidateZip();

    setStatus(
      "Dò thử nghiệm xong. Có vùng sáng trong " +
      detected +
      "/" +
      images.length +
      " ảnh. Hãy kiểm tra và chỉnh lại vùng khoanh."
    );

  } catch (error) {

    console.error(error);

    setStatus("Lỗi dò tự động: " + error.message);

  } finally {

    autoBtn.disabled = false;
    processBtn.disabled = false;

  }

};


/* ======================================
   11. TẢI FILE ZIP
====================================== */

downloadBtn.onclick = () => {

  if (!zipBlob) return;

  const url = URL.createObjectURL(zipBlob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "watermark-removed-images.zip";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 2000);

};


/* ======================================
   12. CHỌN ẢNH
====================================== */

fileInput.addEventListener("change", event => {

  addFiles(event.target.files);

  fileInput.value = "";

});


/* ======================================
   13. KÉO THẢ ẢNH
====================================== */

uploadBox.addEventListener("dragover", event => {

  event.preventDefault();

  uploadBox.classList.add("dragging");

});

uploadBox.addEventListener("dragleave", () => {

  uploadBox.classList.remove("dragging");

});

uploadBox.addEventListener("drop", event => {

  event.preventDefault();

  uploadBox.classList.remove("dragging");

  addFiles(event.dataTransfer.files);

});

</script>
